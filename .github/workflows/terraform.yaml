name: Terraform
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'src/**'
      - 'Dockerfile'
  push:
    branches: [main]
    paths-ignore:
      - 'src/**'
      - 'Dockerfile'

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Branch Protection
        env:
          GH_TOKEN: ${{ secrets.REPO_DELETE_TOKEN }}
        run: |
          cat > /tmp/protection.json <<'JSON'
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "bypass_pull_request_allowances": { "users": ["47141184"] }
            },
            "restrictions": null
          }
          JSON
          gh api -X PUT /repos/Vijay-godson/vijay3-EC2-instance/branches/main/protection --input /tmp/protection.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::003904517980:role/backstage-terraform-github-actions
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: config
        run: terraform init -backend-config="key=ec2-instances/vijay3/terraform.tfstate"

      - name: Reconcile Orphaned Key Pair
        if: github.event_name == 'push'
        working-directory: config
        run: |
          KEY_NAME="vijay3-key"
          if aws ec2 describe-key-pairs --key-names "$KEY_NAME" > /dev/null 2>&1; then
            if terraform state list 2>/dev/null | grep -q "aws_key_pair.deployer"; then
              echo "Key pair $KEY_NAME is managed by this state - leaving it untouched"
            else
              echo "Key pair $KEY_NAME exists in AWS but not in this state (orphan) - deleting it"
              aws ec2 delete-key-pair --key-name "$KEY_NAME"
            fi
          else
            echo "No existing key pair named $KEY_NAME - nothing to reconcile"
          fi

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: config

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: config
        run: terraform plan -var-file=terraform.tfvars

      - name: Terraform Apply
        if: github.event_name == 'push'
        working-directory: config
        run: terraform apply -var-file=terraform.tfvars -auto-approve

      - name: Publish Application URL
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.REPO_DELETE_TOKEN }}
        run: |
          IP=$(terraform -chdir=config output -raw instance_public_ip)
          if [ -z "$IP" ]; then echo "No public IP assigned; skipping URL publish"; exit 0; fi
          sed -i -e "s|http://app-url.invalid|http://$IP|g" -e "s|__INSTANCE_IP__|$IP|g" docs/index.md catalog-info.yaml
          git config user.name "backstage-workflow"
          git config user.email "workflow@backstage.local"
          git add docs/index.md catalog-info.yaml
          git commit -m "Publish application URL http://$IP" || exit 0
          git config --local --unset http.https://github.com/.extraheader || true
          git remote set-url origin https://x-access-token:$GH_TOKEN@github.com/Vijay-godson/vijay3-EC2-instance.git
          git push origin HEAD:main
